# Roda os testes automaticamente a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    # Testa em várias versões do Python: o README promete suporte ao 3.10+
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Um Postgres de verdade para os testes da versão online (banco_postgres.py e demo.py)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        # Espera o banco aceitar conexões antes de rodar os testes
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GASTOS_TESTE_POSTGRES: postgresql://postgres:teste@localhost:5432/postgres

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest -v
